<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="165" viewBox="0 0 1000 165" role="img" aria-labelledby="t d"><title id="t">FPGA hardware and software interface</title><desc id="d">USB keyboard input enters C game logic on MicroBlaze. Six 32-bit AXI4-Lite sprite registers connect it to the SystemVerilog graphics pipeline.</desc><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#5d7d62"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#173b31}.label{font-size:17px;font-weight:bold}.sub{font-size:14px;fill:#4e665b}.small{font-size:13px;fill:#4e665b}.line{stroke:#5d7d62;stroke-width:2;fill:none;marker-end:url(#a)}.box{fill:#fff;stroke:#a6bfac;stroke-width:1.3}.accent{fill:#133e37}.white{fill:white}</style><rect class="box" x="24" y="45" width="170" height="75" rx="5"/><text x="109.0" y="79.5" text-anchor="middle" class="label">USB keyboard</text><text x="109.0" y="101.5" text-anchor="middle" class="sub">Player input</text><rect class="box" x="242" y="45" width="210" height="75" rx="5"/><text x="347.0" y="79.5" text-anchor="middle" class="label">MicroBlaze / C</text><text x="347.0" y="101.5" text-anchor="middle" class="sub">Game state &amp; collisions</text><rect class="box" x="502" y="45" width="205" height="75" rx="5"/><text x="604.5" y="79.5" text-anchor="middle" class="label">AXI4-Lite</text><text x="604.5" y="101.5" text-anchor="middle" class="sub">6 × 32-bit sprite registers</text><rect class="box" x="757" y="45" width="218" height="75" rx="5" style="fill:#133e37"/><text x="866.0" y="79.5" text-anchor="middle" class="label white">SystemVerilog</text><text x="866.0" y="101.5" text-anchor="middle" class="sub white">Tiles, sprites &amp; audio</text><path class="line" d="M194 82 H242"/><path class="line" d="M452 82 H502"/><path class="line" d="M707 82 H757"/></svg>