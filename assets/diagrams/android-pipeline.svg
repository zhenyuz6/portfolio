<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210" role="img" aria-labelledby="t d"><title id="t">Asynchronous Android segmentation</title><desc id="d">Camera frames feed OpenCV region selection and asynchronous neural refinement. Display uses the latest available mask without waiting for every model pass.</desc><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#5d7d62"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#173b31}.label{font-size:17px;font-weight:bold}.sub{font-size:14px;fill:#4e665b}.small{font-size:13px;fill:#4e665b}.line{stroke:#5d7d62;stroke-width:2;fill:none;marker-end:url(#a)}.box{fill:#fff;stroke:#a6bfac;stroke-width:1.3}.accent{fill:#133e37}.white{fill:white}</style><rect class="box" x="24" y="62" width="150" height="65" rx="5"/><text x="99.0" y="91.5" text-anchor="middle" class="label">Camera</text><text x="99.0" y="113.5" text-anchor="middle" class="sub">Live frame</text><rect class="box" x="220" y="62" width="200" height="65" rx="5"/><text x="320.0" y="91.5" text-anchor="middle" class="label">OpenCV cues</text><text x="320.0" y="113.5" text-anchor="middle" class="sub">Candidate region</text><rect class="box" x="475" y="27" width="220" height="65" rx="5"/><text x="585.0" y="56.5" text-anchor="middle" class="label">PyTorch Lite</text><text x="585.0" y="78.5" text-anchor="middle" class="sub">Async cropped inference</text><rect class="box" x="475" y="119" width="220" height="65" rx="5"/><text x="585.0" y="148.5" text-anchor="middle" class="label">Latest mask</text><text x="585.0" y="170.5" text-anchor="middle" class="sub">Available refinement</text><rect class="box" x="758" y="62" width="218" height="65" rx="5" style="fill:#133e37"/><text x="867.0" y="91.5" text-anchor="middle" class="label white">Composite &amp; display</text><text x="867.0" y="113.5" text-anchor="middle" class="sub white">Continuous preview</text><path class="line" d="M174 94 H220"/><path class="line" d="M420 94 H447 V59 H475"/><path class="line" d="M585 92 V119"/><path class="line" d="M695 151 H730 V112 H758"/><path class="line" d="M98 62 V15 H867 V62"/><text x="245" y="202" class="small">Display path retains the latest available mask</text></svg>