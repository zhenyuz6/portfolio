<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="160" viewBox="0 0 1000 160" role="img" aria-labelledby="t d"><title id="t">Printable CNT materials workflow</title><desc id="d">Ink formulation and rheology guide programmed deposition. Drying, furnace treatment, SEM, geometry, and electrical measurements characterize the specimens.</desc><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#5d7d62"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#173b31}.label{font-size:17px;font-weight:bold}.sub{font-size:14px;fill:#4e665b}.small{font-size:13px;fill:#4e665b}.line{stroke:#5d7d62;stroke-width:2;fill:none;marker-end:url(#a)}.box{fill:#fff;stroke:#a6bfac;stroke-width:1.3}.accent{fill:#133e37}.white{fill:white}</style><rect class="box" x="24" y="43" width="205" height="75" rx="5"/><text x="126.5" y="77.5" text-anchor="middle" class="label">Formulate the ink</text><text x="126.5" y="99.5" text-anchor="middle" class="sub">SDS / SDOC and rheology</text><rect class="box" x="276" y="43" width="210" height="75" rx="5"/><text x="381.0" y="77.5" text-anchor="middle" class="label">Program deposition</text><text x="381.0" y="99.5" text-anchor="middle" class="sub">Sample-dependent motion</text><rect class="box" x="533" y="43" width="210" height="75" rx="5"/><text x="638.0" y="77.5" text-anchor="middle" class="label">Treat &amp; inspect</text><text x="638.0" y="99.5" text-anchor="middle" class="sub">Drying, furnace and SEM</text><rect class="box" x="790" y="43" width="185" height="75" rx="5" style="fill:#133e37"/><text x="882.5" y="77.5" text-anchor="middle" class="label white">Measure</text><text x="882.5" y="99.5" text-anchor="middle" class="sub white">Geometry &amp; resistance</text><path class="line" d="M229 80 H276"/><path class="line" d="M486 80 H533"/><path class="line" d="M743 80 H790"/></svg>