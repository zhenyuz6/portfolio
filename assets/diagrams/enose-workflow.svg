<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-labelledby="t d"><title id="t">Electronic-nose sensing and analysis</title><desc id="d">Gas sensors feed analog signal conditioning and STM32 acquisition. UART carries records to PC feature extraction and classification. Temperature, humidity, and OLED feedback are integrated at the MCU.</desc><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#5d7d62"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#173b31}.label{font-size:17px;font-weight:bold}.sub{font-size:14px;fill:#4e665b}.small{font-size:13px;fill:#4e665b}.line{stroke:#5d7d62;stroke-width:2;fill:none;marker-end:url(#a)}.box{fill:#fff;stroke:#a6bfac;stroke-width:1.3}.accent{fill:#133e37}.white{fill:white}</style><rect class="box" x="24" y="55" width="178" height="75" rx="5"/><text x="113.0" y="89.5" text-anchor="middle" class="label">Gas sensors</text><text x="113.0" y="111.5" text-anchor="middle" class="sub">Response patterns</text><rect class="box" x="248" y="55" width="210" height="75" rx="5"/><text x="353.0" y="89.5" text-anchor="middle" class="label">Analog front end</text><text x="353.0" y="111.5" text-anchor="middle" class="sub">Scale, filter &amp; buffer</text><rect class="box" x="504" y="55" width="210" height="75" rx="5"/><text x="609.0" y="89.5" text-anchor="middle" class="label">STM32 acquisition</text><text x="609.0" y="111.5" text-anchor="middle" class="sub">ADC &amp; reference correction</text><rect class="box" x="760" y="55" width="215" height="75" rx="5" style="fill:#133e37"/><text x="867.5" y="89.5" text-anchor="middle" class="label white">PC analysis</text><text x="867.5" y="111.5" text-anchor="middle" class="sub white">Features &amp; classification</text><path class="line" d="M202 92 H248"/><path class="line" d="M458 92 H504"/><path class="line" d="M714 92 H760"/><text x="735" y="80" text-anchor="middle" class="small">UART</text><text x="609" y="157" text-anchor="middle" class="sub">Temperature / humidity · OLED feedback</text></svg>