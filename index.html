<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Zhenyu Zhang's electrical engineering research and project portfolio.">
  <meta name="theme-color" content="#102d2a">
  <title>Engineering Portfolio | Zhenyu Zhang</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./portfolio-data.js" defer></script>
  <script src="./portfolio.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#projects">Skip to projects</a>

  <header class="hero" id="top">
    <div class="wrap">
      <div class="masthead">
        <a class="wordmark" id="site-name" href="#top">Zhenyu Zhang</a>
        <button class="print-button" id="print-portfolio" type="button" hidden>Print / Save as PDF</button>
      </div>
      <div class="intro">
        <h1>Engineering<br class="screen-break"> portfolio</h1>
        <p id="affiliation" class="affiliation"></p>
        <p id="biography" class="biography" hidden></p>
        <p id="profile-links" class="profile-links" hidden></p>
      </div>
    </div>
  </header>

  <div class="wrap layout">
    <nav class="contents" id="contents" aria-label="Project contents" hidden>
      <h2>Contents</h2>
    </nav>
    <main id="projects" tabindex="-1">
      <p class="draft-note" id="draft-note" hidden>Project descriptions and figures are pending.</p>
      <noscript><p>Enable JavaScript to view the project list.</p></noscript>
    </main>
  </div>

  <footer class="footer">
    <div class="wrap"><a href="#top">Back to top ↑</a></div>
  </footer>
</body>
</html>
